# Local stack - every service is free and open source.
#   docker compose up --build      ->  API on http://localhost:8000
#                                       S3 console on http://localhost:9001
name: streamforge

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-change-me-0123456789}
  DATABASE_URL: postgresql+psycopg://streamforge:streamforge@postgres:5432/streamforge
  REDIS_URL: redis://redis:6379/0
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-streamforge}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-streamforge-secret}
  # MinIO stands in for Amazon S3 locally. Remove both endpoints to use real S3.
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_CREATE_BUCKETS: "true"
  RAW_BUCKET: streamforge-raw
  MEDIA_BUCKET: streamforge-media

services:
  api:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  # Transcode workers - scale out with:  docker compose up --scale worker=4
  worker:
    build: .
    command: ["python", "-m", "streamforge.worker"]
    environment: *app-env
    depends_on:
      api: { condition: service_started }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: streamforge
      POSTGRES_PASSWORD: streamforge
      POSTGRES_DB: streamforge
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamforge"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # S3-compatible object storage. MinIO stopped publishing new community images
  # in late 2025, so this pins the last widely used release.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-streamforge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-streamforge-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
