<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StreamForge{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('web.static', filename='css/app.css') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='3' width='14' height='2' fill='%232f5bff'/%3E%3Crect x='1' y='7' width='10' height='2' fill='%2317202b'/%3E%3Crect x='1' y='11' width='6' height='2' fill='%2317202b'/%3E%3C/svg%3E">
</head>
<body data-page="{{ page }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="wordmark" href="/" aria-label="StreamForge home">
      <span class="wordmark-ladder" aria-hidden="true"><i></i><i></i><i></i></span>
      StreamForge
    </a>
    <form class="search" action="/" role="search">
      <label class="sr-only" for="q">Search videos</label>
      <input id="q" name="q" type="search" placeholder="Search videos" autocomplete="off">
    </form>
    <nav class="nav" aria-label="Main">
      <a href="/studio" data-auth="in" hidden>Your videos</a>
      <a class="btn btn-primary" href="/upload">Upload</a>
      <a href="/login" data-auth="out">Sign in</a>
      <button class="linklike" type="button" data-auth="in" data-action="logout" hidden>Sign out</button>
    </nav>
  </header>
  <main id="main">{% block main %}{% endblock %}</main>
  <div class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="{{ url_for('web.static', filename='js/shell.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
